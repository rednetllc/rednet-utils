name: Actual Sheet Sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        npm: ['11.19.0', '12.2.0']
    defaults:
      run:
        working-directory: Server Utilities/actual-sheet-sync
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Server Utilities/actual-sheet-sync/package-lock.json
      - run: npm install --global npm@${{ matrix.npm }}
      - run: npm ci --omit=dev --strict-allow-scripts
      - run: npm test
      - run: npm run test:sdk

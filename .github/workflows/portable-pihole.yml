name: Portable Pi-hole

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backends:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Networking Tools/portable-pihole
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v test_deploy.SessionTests test_deploy.BackendTests test_deploy.PreflightTests test_host
      - name: Check POSIX entry point
        if: runner.os != 'Windows'
        run: sh -n start.sh
      - name: Check PowerShell entry point
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'start.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Networking Tools/portable-pihole
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: docker compose version
      - run: python -m unittest -v test_deploy.ComposeTests
